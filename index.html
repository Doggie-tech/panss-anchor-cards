<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PANSS 评分锚点速查卡</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #fbf7fb;
      --panel: rgba(255, 255, 255, 0.9);
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60, 60, 67, 0.16);
      --brand: #8067b7;
      --brand-dark: #59417e;
      --soft: rgba(128, 103, 183, 0.14);
      --warn: #775b16;
      --warn-bg: #fff4d7;
      --shadow: 0 18px 42px rgba(80, 64, 110, 0.13);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 15% 0%, rgba(181, 226, 210, 0.48), transparent 34%),
        radial-gradient(circle at 88% 4%, rgba(244, 194, 213, 0.42), transparent 30%),
        linear-gradient(180deg, #fffcff 0%, var(--bg) 48%, #f3eef8 100%);
      color: var(--ink);
      font-size: 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-x: contain;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: max(10px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
    }

    header {
      width: min(1120px, 100%);
      margin: 0 auto 10px;
      position: sticky;
      top: max(8px, env(safe-area-inset-top));
      z-index: 10;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 8px 24px rgba(80, 64, 110, 0.1);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
    }

    h1 {
      margin: 0;
      font-size: clamp(18px, 2.3vw, 24px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .scale-tabs {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .scale-tab {
      min-height: 42px;
      border: 0;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.62);
      color: var(--muted);
      font: inherit;
      font-size: clamp(15px, 2vw, 19px);
      font-weight: 800;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(60, 60, 67, 0.08);
    }

    .scale-tab.active {
      background: linear-gradient(135deg, #d8f3e8, #eee4ff 58%, #ffe1ec);
      color: var(--brand-dark);
      box-shadow: 0 6px 18px rgba(128, 103, 183, 0.16);
    }

    .notice {
      margin: 0;
      padding: 12px 14px;
      border: 1px solid #f0d99d;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: clamp(16px, 2vw, 19px);
    }

    main {
      width: min(1120px, 100%);
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      touch-action: pan-y;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .card.is-changing {
      transform: scale(0.985);
      opacity: 0.76;
    }

    .card-head {
      padding: clamp(13px, 2vw, 22px);
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.66));
    }

    .title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .item-title {
      margin: 0;
      font-size: clamp(27px, 3.6vw, 42px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .dimension {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--brand-dark);
      font-size: clamp(15px, 1.9vw, 19px);
      font-weight: 800;
    }

    .focus-line {
      margin: 0;
      max-width: 58em;
      color: var(--muted);
      font-size: clamp(17px, 2.1vw, 22px);
      line-height: 1.32;
    }

    .card-body {
      padding: clamp(14px, 2.2vw, 24px);
      display: grid;
      gap: 14px;
    }

    section {
      display: grid;
      gap: 7px;
    }

    h2 {
      margin: 0;
      color: var(--brand-dark);
      font-size: clamp(18px, 2.35vw, 24px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--ink);
      font-size: clamp(17px, 2.2vw, 22px);
    }

    .scale-section {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.64);
    }

    .anchors {
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 7px;
      list-style: none;
    }

    .anchors li {
      min-height: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.78);
      display: grid;
      grid-template-columns: 84px 1fr;
      align-items: center;
      gap: 0;
      overflow: hidden;
    }

    .score {
      height: 100%;
      min-height: 70px;
      padding: 12px 10px;
      color: var(--brand-dark);
      font-size: clamp(16px, 2.25vw, 22px);
      font-weight: 900;
      line-height: 1;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.72);
      border-right: 1px solid var(--line);
    }

    .bar-panel {
      min-width: 0;
    }

    .bar-track {
      min-height: 70px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: rgba(60, 60, 67, 0.06);
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      height: 100%;
      background: linear-gradient(90deg, #d8f3e8 0%, #bbe3ef 30%, #d8c9ff 58%, #ffd6e4 82%, #ffb5c7 100%);
      opacity: 0.74;
    }

    .anchor-text {
      position: relative;
      z-index: 1;
      padding: 12px 14px;
      color: var(--ink);
      display: grid;
      gap: 3px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .anchor-main {
      font-size: clamp(16px, 2.05vw, 21px);
      font-weight: 800;
      line-height: 1.25;
    }

    .anchor-guide {
      color: rgba(29, 29, 31, 0.76);
      font-size: clamp(13px, 1.75vw, 17px);
      line-height: 1.22;
    }

    .anchor-example {
      color: rgba(89, 65, 126, 0.88);
      font-size: clamp(12px, 1.55vw, 16px);
      line-height: 1.24;
    }

    .quick-list {
      margin: 0;
      padding-left: 1.15em;
      color: var(--ink);
      font-size: clamp(17px, 2.15vw, 22px);
    }

    .quick-list li + li {
      margin-top: 4px;
    }

    .q-label {
      color: var(--brand-dark);
      font-weight: 900;
    }

    .swipe-edge {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 34px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 160ms ease;
      z-index: 20;
    }

    .swipe-edge.left {
      left: 0;
      background: linear-gradient(90deg, rgba(128, 103, 183, 0.22), transparent);
    }

    .swipe-edge.right {
      right: 0;
      background: linear-gradient(270deg, rgba(128, 103, 183, 0.22), transparent);
    }

    .swipe-edge.show {
      opacity: 1;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 760px) {
      body {
        font-size: 18px;
      }

      .topline {
        flex-direction: column;
      }

      .scale-tabs {
        width: 100%;
      }

      .anchors li {
        grid-template-columns: 72px 1fr;
      }
    }

    @media (orientation: landscape) and (min-width: 900px) {
      .card-body {
        grid-template-columns: 1fr 1.35fr;
      }

      .span-all {
        grid-column: 1 / -1;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .notice {
        display: none;
      }

      .app {
        padding: 0;
      }

      .card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="topline">
        <h1>临床速查卡</h1>
        <div class="scale-tabs" id="scaleTabs" aria-label="量表切换"></div>
      </div>
    </header>

    <main>
      <article class="card" aria-live="polite">
        <div class="card-head">
          <div class="title-row">
            <h2 class="item-title" id="itemTitle">P1 妄想</h2>
            <div class="dimension" id="dimension">阳性量表</div>
          </div>
          <p class="focus-line" id="focus"></p>
        </div>
        <div class="card-body">
          <section>
            <h2>追问路径</h2>
            <ul class="quick-list" id="questions"></ul>
          </section>

          <section class="span-all scale-section">
            <h2>1-7 分现场定级</h2>
            <ol class="anchors" id="anchors"></ol>
          </section>

          <section class="span-all">
            <h2>易混淆点</h2>
            <p class="muted" id="confusions"></p>
          </section>
        </div>
      </article>

    </main>
  </div>
  <div class="swipe-edge left" id="swipeLeft"></div>
  <div class="swipe-edge right" id="swipeRight"></div>

  <script>
    const levelNames = ["无", "可疑", "轻度", "中度", "较重", "重度", "极重"];
    const levelGuides = [
      "未见该表现；访谈、观察和补充信息均不支持。",
      "只有线索或偶发；证据不足，尚不能确定为明确症状。",
      "明确但轻；频率低、可被引导，功能影响很小。",
      "中度明确；访谈中能看到，或已影响日常/关系/判断。",
      "较重；频繁、坚定或难转移，需要反复澄清、安抚或管理。",
      "重度；持续存在，明显支配行为或功能，常规引导效果差。",
      "极重；几乎完全被该症状控制，或伴迫切安全/照护风险。"
    ];
    const domainLevelGuides = {
      belief: [
        "无此信念；能按现实解释事件。",
        "只是怀疑或一闪而过；能接受其他解释。",
        "明确但松动；追问后可部分修正。",
        "较明确且反复出现；开始影响判断或互动。",
        "确信度高；行为已围绕该信念调整。",
        "持续坚信；明显支配日常决定或关系。",
        "完全被信念控制，或因此出现迫切风险。"
      ],
      speech: [
        "思路清楚，表达连贯。",
        "偶尔含糊；不影响理解。",
        "轻度跑题或贫乏；提示后能回到主题。",
        "交流明显费力；需要反复澄清才能评分。",
        "频繁中断、松散或少语；重要信息难取得。",
        "多数内容难跟随；访谈效率很低。",
        "几乎无法完成有效访谈。"
      ],
      behavior: [
        "行为平稳，可合作。",
        "轻微急躁或异常；无需干预。",
        "明确可见但可被语言引导。",

        "反复出现；需要持续管理或降温。",
        "强烈且难控制；照护或安全压力明显。",
        "失控、攻击、自伤或立即安全风险。"
      ],
      negative: [

        "持续减少；明显影响交流或日常参与。",
        "多数情境受影响；需要外界推动。",
        "严重缺失；功能明显依赖他人。",
        "几乎完全缺失或退缩，基本不能参与。"
      ],
      mood: [
        "无明显痛苦或担忧。",
        "偶有轻微情绪；可自行转移。",
        "明确但可控；功能影响轻。",
        "持续影响访谈、睡眠、活动或关系。",
        "痛苦明显；反复需要安抚或确认。",
        "严重且难缓解；功能显著下降。",
        "极端痛苦，或伴迫切自伤/他伤风险。"
      ],
      cognition: [
        "定向、注意、判断或抽象能力良好。",
        "偶有犹豫或小错；不影响评估。",
        "轻度困难；提示后能完成。",
        "访谈中反复需要提示或具体化。",
        "简单任务也常出错；日常判断受影响。",
        "严重困难；配合评估明显受限。",
        "基本无法完成任务，或严重混乱需照护。"
      ],
      function: [
        "启动、坚持和社交参与基本正常。",
        "轻微减少；仍可自行完成。",
        "明确减少；偶需提醒或鼓励。",
        "日常活动或社交明显受限。",
        "多数任务需督促或陪同。",
        "严重受限；难以维持基本安排。",
        "几乎完全不能启动或参与日常。"
      ]
    };
    const domainExamples = {
      belief: [
        "例：追问后无被害、特殊身份、被控制等固定信念。",
        "例：说“可能有人针对我”，但能承认也许是误会。",
        "例：偶尔认为同事针对自己，解释后能部分接受。",
        "例：反复坚称被监视，谈话需要围绕证据澄清。",
        "例：因确信被害而回避出门、报警或与人冲突。",
        "例：多数决定受信念驱动，家属难以劝回现实。",
        "例：按妄想行动，出现攻击、自伤、逃跑或严重照护风险。"
      ],
      speech: [
        "例：能按时间、人物、事件讲清楚。",
        "例：偶尔答偏，但提醒后马上修正。",
        "例：回答短、跑题或具体化，不过核心信息能取得。",
        "例：多次需要“这和刚才有什么关系？”来拉回。",
        "例：谈话反复断裂，病史或症状信息取得困难。",
        "例：大段内容无法理解，只能获得零散片段。",
        "例：问答基本不能成立，无法可靠完成评估。"
      ],
      behavior: [
        "例：访谈中坐得住、能等待、能按要求配合。",
        "例：有点急、烦或怪异，但不影响流程。",
        "例：明显坐立不安、易怒或冲动，提醒后能停。",
        "例：打断、争辩、拒答或激动，需设限才能继续。",
        "例：多次升温、威胁、摔物倾向或反复违反限制。",
        "例：很难降温，需要人员持续陪同或环境管理。",
        "例：已经失控或即将攻击、自伤、冲出现场。"
      ],
      negative: [
        "例：表情、语调、主动交流和社交接近既往。",
        "例：略显平淡或被动，但仍自然回应。",
        "例：表情少、回答短，提示后还能展开。",
        "例：持续少语、少表情或少主动，访谈明显受影响。",
        "例：多数时候需要别人推动，社交和日常参与下降。",
        "例：几乎不主动说话/活动，功能明显依赖照护。",
        "例：基本无情感回应、无主动活动或完全退缩。"
      ],
      mood: [
        "例：无持续担忧、低落、内疚或躯体焦虑。",
        "例：偶尔紧张/低落，话题转开后可缓解。",
        "例：明确痛苦，但睡眠、活动或配合影响较小。",
        "例：症状持续占用注意，影响访谈或一天安排。",
        "例：反复求证、哭泣、自责或担心，需要安抚。",
        "例：明显无望、惊恐或躯体化，功能显著下降。",
        "例：伴自杀意念、严重惊恐失控或迫切安全风险。"
      ],
      cognition: [
        "例：时间地点人物清楚，能完成简单注意/抽象任务。",
        "例：小错或慢一点，但自我修正快。",
        "例：需提示才能完成倒数、概括或解释后果。",
        "例：反复分心、定向错误或判断偏差影响访谈。",
        "例：简单任务常失败，日常决定已受影响。",
        "例：严重混乱或判断差，需要他人持续协助。",
        "例：不定向、无法配合，或判断问题带来立即风险。"
      ],
      function: [
        "例：能自己起床、洗漱、安排活动和基本社交。",
        "例：略拖延或减少，但提醒很少。",
        "例：部分活动要催促，仍能完成关键任务。",
        "例：工作/学习/家务/社交已有明显下降。",
        "例：大多数任务要别人安排或陪同。",
        "例：基本活动难维持，常需要照护者介入。",
        "例：几乎不启动、不参与，日常功能接近停摆。"
      ],
      default: [
        "例：没有稳定证据支持该表现。",
        "例：只有线索，需继续观察或向家属核实。",
        "例：明确存在，但轻、少、可控。",
        "例：中度存在，已影响访谈或日常。",
        "例：频繁或难控制，需要反复处理。",
        "例：严重影响功能或照护安排。",
        "例：极端严重，或伴立即安全风险。"
      ]
    };
    function getGuideType(item) {
      if (["P1", "P5", "P6", "G9", "G15"].includes(item.id)) return "belief";
      if (["P2", "N3", "N6", "N7"].includes(item.id)) return "speech";
      if (["P4", "P7", "G4", "G5", "G8", "G14", "S1", "S2", "S3"].includes(item.id)) return "behavior";
      if (["G2", "G3", "G6", "G1"].includes(item.id)) return "mood";
      if (["N5", "G10", "G11", "G12"].includes(item.id)) return "cognition";
      if (["N4", "G7", "G13", "G16"].includes(item.id)) return "function";
      if (item.id.startsWith("N")) return "negative";
      return "default";
    }

    const items = [
      {
        id: "P1",
        name: "妄想",
        dimension: "阳性量表",
        focus: "固定的错误信念及其确信度、荒谬性、系统化程度，以及对行为和关系的影响。",
        anchors: ["无妄想", "似有但不确定", "单一轻度观念，可被动摇", "明确妄想，影响谈话", "多项或较坚定，影响行为", "系统化且明显支配行为", "几乎完全被妄想控制"],
        questions: ["是否有人害你、监视你或传递特殊信息？", "你有多确定？别人怎么解释？", "这些想法让你做了什么改变？"],
        confusions: "与猜疑、文化信念、强迫观念区分；重点看确信度和现实检验。"
      },
      {
        id: "P2",

          "例：惊恐发作、明显抑郁或朋友很少，功能中度受限。",
          "例：严重强迫/抑郁，不能稳定工作，关系冲突明显。",
          "例：言语有时不合逻辑，或工作、家庭、判断多方面差。",

    const capsItems = [

        questions: ["是否会不由自主想起创伤画面？", "有没有相关噩梦或像回到现场的感觉？", "被触发时身体会不会心跳、出汗、发抖？"],
        confusions: "普通回忆可主动停止；再体验常突然而侵入，并伴明显痛苦或生理唤起。"
      },
      {
        id: "CAPS-C",
        name: "C 回避/麻木",
        dimension: "CAPS / DSM-IV PTSD",
        focus: "评估回避想法、地点、人物，以及兴趣下降、疏离、情感麻木、未来受限感；DSM-IV 需至少 3 项。",
        levelNames: ["0 无", "1 轻", "2 阈下", "3 阈值", "4 重"],
        anchors: ["无明显回避或麻木", "轻微回避，功能影响小", "有数项但未达诊断数量/强度", "至少 3 项达到临床阈值", "广泛回避和麻木，生活明显缩窄"],
        guides: ["不刻意回避，情感和兴趣基本保留。", "有轻微回避，但生活范围未明显缩小。", "出现回避/麻木，但数量或强度不足。", "至少 3 类症状明确且造成影响。", "回避广泛，亲密、兴趣和未来感明显受损。"],
        examples: ["例：仍能经过相关地点，也能谈起事件。", "例：不太愿意聊，但必要时可以谈。", "例：避开新闻和某条路，同时兴趣略降。", "例：不谈、不去相关地点、疏离家人、情感变麻木。", "例：几乎所有活动围绕避开线索，生活半径明显缩小。"],
        questions: ["你会刻意不想、不说或避开相关地方/人吗？", "兴趣、亲近感或情绪反应是否变少？", "有没有觉得未来变短或没有前途？"],
        confusions: "回避可被误认为阴性症状或抑郁；要追问是否围绕创伤线索。"
      },
      {
        id: "CAPS-D",
        name: "D 高警觉",
        dimension: "CAPS / DSM-IV PTSD",
        focus: "评估睡眠、易怒、注意、过度警觉和惊跳反应；DSM-IV 需至少 2 项。",
        levelNames: ["0 无", "1 轻", "2 阈下", "3 阈值", "4 重"],
        anchors: ["无持续高警觉", "偶尔紧张或睡差", "有症状但不足诊断阈值", "至少 2 项达到临床阈值", "持续警觉，安全感和功能明显受损"],
        guides: ["睡眠、警觉和惊跳接近创伤前。", "偶有紧张，但可由日常压力解释。", "有睡眠/易怒/警觉症状，但不足 2 项阈值。", "至少 2 项明确，影响睡眠、注意或关系。", "持续处于危险预期中，功能明显受损。"],
        examples: ["例：能睡，走在路上不特别警戒。", "例：偶尔被声音吓一跳，但很快恢复。", "例：睡差和易怒都有一点，但不稳定。", "例：长期失眠、易怒、坐背靠墙、反复查门。", "例：无法在人群停留，夜间巡查，惊跳后很久不能平复。"],
        questions: ["睡眠、脾气、注意力有没有创伤后变化？", "是否总在警戒、坐背靠墙、检查出口？", "突然声音会不会明显惊跳？"],
        confusions: "与广泛焦虑、躁狂睡眠减少、物质影响区分；看是否创伤后出现并与威胁感相关。"
      },
      {
        id: "CAPS-EF",
        name: "E/F 时程与损害",
        dimension: "CAPS / DSM-IV PTSD",
        focus: "确认症状持续超过 1 个月，并造成临床显著痛苦或社会、职业等功能损害。",
        levelNames: ["E", "F", "急性", "慢性/迟发"],
        anchors: ["症状持续时间超过 1 个月", "造成明显痛苦或功能损害", "不足 3 个月可描述为急性", "超过 3 个月或迟发起病需注明"],
        guides: ["DSM-IV PTSD 需症状持续超过 1 个月。", "不仅有症状，还要有临床显著痛苦或功能损害。", "持续 1-3 个月可标注急性。", "超过 3 个月或创伤后延迟出现需注明。"],
        examples: ["例：创伤后 6 周仍有再体验、回避和高警觉。", "例：因症状不能工作、回避伴侣、睡眠严重受损。", "例：创伤后第 2 个月症状明显但病程较短。", "例：半年后仍明显受影响，或数月后才全面发作。"],
        questions: ["这些症状持续多久了？", "对工作、学习、亲密关系或自理影响多大？", "创伤后多久开始明显出现？"],
        confusions: "若未满 1 个月，考虑急性应激相关问题；诊断还需综合临床判断。"
      }
    ];

    const scales = {
      panss: { label: "PANSS", title: "PANSS 评分锚点", items },
      brms: { label: "BRMS", title: "BRMS 躁狂量表", items: brmsItems },
      gaf: { label: "GAF", title: "GAF 功能评定", items: gafItems },
      caps: { label: "CAPS", title: "CAPS/PTSD 诊断", items: capsItems }
    };

    let currentIndex = 0;
    let currentScaleKey = "panss";

    const scaleTabs = document.getElementById("scaleTabs");
    const itemTitle = document.getElementById("itemTitle");
    const dimension = document.getElementById("dimension");
    const focus = document.getElementById("focus");
    const card = document.querySelector(".card");
    const questions = document.getElementById("questions");
    const anchors = document.getElementById("anchors");
    const confusions = document.getElementById("confusions");
    const swipeLeft = document.getElementById("swipeLeft");
    const swipeRight = document.getElementById("swipeRight");
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    function getCurrentItems() {
      return scales[currentScaleKey].items;
    }

    function renderScaleTabs() {
      scaleTabs.innerHTML = "";
      Object.entries(scales).forEach(([key, scale]) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `scale-tab${key === currentScaleKey ? " active" : ""}`;
        button.textContent = scale.label;
        button.addEventListener("click", () => {
          currentScaleKey = key;
          currentIndex = 0;
          renderScaleTabs();
          renderCard();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
        scaleTabs.appendChild(button);
      });
    }

    function renderCard() {
      const currentItems = getCurrentItems();
      const item = currentItems[currentIndex];
      const label = `${item.id} ${item.name}`;
      const guideType = getGuideType(item);
      const guideSet = domainLevelGuides[guideType] || levelGuides;
      const exampleSet = domainExamples[guideType] || domainExamples.default;
      const scoreLabels = item.levelNames || levelNames;
      const scaleTitle = scales[currentScaleKey].title;

      document.title = `${label} - ${scaleTitle}`;
      itemTitle.textContent = label;
      dimension.textContent = item.dimension;
      focus.textContent = item.focus;
      confusions.textContent = item.confusions;

      questions.innerHTML = "";
      const questionLabels = ["先开放", "再定级", "看影响/风险"];
      item.questions.forEach((question, index) => {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.className = "q-label";
        label.textContent = `${questionLabels[index] || "补充"}：`;
        li.append(label, document.createTextNode(question));
        questions.appendChild(li);
      });

      anchors.innerHTML = "";
      item.anchors.forEach((text, index) => {
        const li = document.createElement("li");
        const score = document.createElement("span");
        const panel = document.createElement("div");
        const track = document.createElement("div");
        const fill = document.createElement("div");
        const anchorText = document.createElement("span");
        const anchorMain = document.createElement("span");
        const anchorGuide = document.createElement("span");
        const anchorExample = document.createElement("span");
        score.className = "score";
        panel.className = "bar-panel";
        track.className = "bar-track";
        fill.className = "bar-fill";
        anchorText.className = "anchor-text";
        anchorMain.className = "anchor-main";
        anchorGuide.className = "anchor-guide";
        anchorExample.className = "anchor-example";
        score.textContent = scoreLabels[index] || `${index + 1}`;
        fill.style.width = `${((index + 1) / item.anchors.length) * 100}%`;
        anchorMain.textContent = text;
        anchorGuide.textContent = item.guides?.[index] || guideSet[index] || "按临床严重度、频率、功能影响和安全风险综合锚定。";
        anchorExample.textContent = item.examples?.[index] || exampleSet[index] || "";
        anchorText.append(anchorMain, anchorGuide, anchorExample);
        track.append(fill, anchorText);
        panel.appendChild(track);
        li.append(score, panel);
        anchors.appendChild(li);
      });
    }

    function go(delta) {
      const currentItems = getCurrentItems();
      const nextIndex = Math.min(currentItems.length - 1, Math.max(0, currentIndex + delta));
      if (nextIndex !== currentIndex) {
        currentIndex = nextIndex;
        card.classList.add("is-changing");
        setTimeout(() => {
          renderCard();
          card.classList.remove("is-changing");
        }, 110);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function flashEdge(delta) {
      const edge = delta < 0 ? swipeLeft : swipeRight;
      edge.classList.add("show");
      window.setTimeout(() => edge.classList.remove("show"), 180);
    }

    card.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    card.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      const elapsed = Date.now() - touchStartTime;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4 && elapsed < 900) {
        const delta = dx < 0 ? 1 : -1;
        flashEdge(delta);
        go(delta);
      }
    }, { passive: true });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        go(-1);
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        go(1);
      }
    });

    renderScaleTabs();
    renderCard();
  </script>
</body>
