<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PANSS 评分锚点速查卡</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f3ef;
      --panel: rgba(255, 255, 255, 0.9);
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --line: rgba(60, 60, 67, 0.16);
      --brand: #315f72;
      --brand-dark: #244a59;
      --soft: rgba(49, 95, 114, 0.12);
      --warn: #775b16;
      --warn-bg: #fff4d7;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.12);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 18% 0%, rgba(133, 156, 146, 0.22), transparent 35%),
        radial-gradient(circle at 82% 10%, rgba(82, 103, 126, 0.14), transparent 30%),
        linear-gradient(180deg, #fbfaf7 0%, var(--bg) 45%, #ebe8e1 100%);
      color: var(--ink);
      font-size: 20px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-x: contain;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: max(16px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    }

    header {
      display: none;
    }

    .topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.76);
      box-shadow: 0 10px 30px rgba(52, 64, 66, 0.1);
      backdrop-filter: blur(22px) saturate(1.6);
      -webkit-backdrop-filter: blur(22px) saturate(1.6);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4vw, 42px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .progress-pill {
      flex: 0 0 auto;
      padding: 9px 14px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--brand-dark);
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 700;
      white-space: nowrap;
    }

    .notice {
      margin: 0;
      padding: 12px 14px;
      border: 1px solid #f0d99d;
      border-radius: 8px;
      background: var(--warn-bg);
      color: var(--warn);
      font-size: clamp(16px, 2vw, 19px);
    }

    main {
      width: min(980px, 100%);
      margin: 0 auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card {
      flex: 1;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      touch-action: pan-y;
      transition: transform 180ms ease, opacity 180ms ease;
    }

    .card.is-changing {
      transform: scale(0.985);
      opacity: 0.76;
    }

    .card-head {
      padding: clamp(18px, 2.6vw, 28px);
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 8px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.66));
    }

    .title-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .item-title {
      margin: 0;
      font-size: clamp(32px, 4.4vw, 50px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .dimension {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--soft);
      color: var(--brand-dark);
      font-size: clamp(17px, 2.2vw, 22px);
      font-weight: 800;
    }

    .focus-line {
      margin: 0;
      max-width: 58em;
      color: var(--muted);
      font-size: clamp(19px, 2.45vw, 25px);
      line-height: 1.42;
    }

    .card-body {
      padding: clamp(20px, 3.2vw, 32px);
      display: grid;
      gap: 22px;
    }

    section {
      display: grid;
      gap: 9px;
    }

    h2 {
      margin: 0;
      color: var(--brand-dark);
      font-size: clamp(21px, 2.8vw, 28px);
      line-height: 1.2;
      letter-spacing: 0;
    }

    p {
      margin: 0;
      color: var(--ink);
      font-size: clamp(20px, 2.7vw, 27px);
    }

    .scale-section {
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.64);
    }

    .anchors {
      margin: 0;
      padding: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      list-style: none;
    }

    .anchors li {
      min-height: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.78);
      display: grid;
      grid-template-columns: 92px 1fr;
      align-items: center;
      gap: 0;
      overflow: hidden;
    }

    .score {
      height: 100%;
      min-height: 92px;
      padding: 12px 10px;
      color: var(--brand-dark);
      font-size: clamp(19px, 2.8vw, 26px);
      font-weight: 900;
      line-height: 1;
      display: grid;
      place-items: center;
      background: rgba(255, 255, 255, 0.72);
      border-right: 1px solid var(--line);
    }

    .bar-panel {
      min-width: 0;
    }

    .bar-track {
      min-height: 92px;
      position: relative;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: rgba(60, 60, 67, 0.06);
    }

    .bar-fill {
      position: absolute;
      inset: 0 auto 0 0;
      height: 100%;
      background: linear-gradient(90deg, #d8e0d7 0%, #9cb7ad 28%, #63889a 58%, #9a756e 82%, #8b3f46 100%);
      opacity: 0.74;
    }

    .anchor-text {
      position: relative;
      z-index: 1;
      padding: 12px 14px;
      color: var(--ink);
      display: grid;
      gap: 3px;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.55);
    }

    .anchor-main {
      font-size: clamp(18px, 2.4vw, 24px);
      font-weight: 800;
      line-height: 1.25;
    }

    .anchor-guide {
      color: rgba(29, 29, 31, 0.76);
      font-size: clamp(15px, 2vw, 20px);
      line-height: 1.28;
    }

    .anchor-example {
      color: rgba(36, 74, 89, 0.9);
      font-size: clamp(14px, 1.8vw, 18px);
      line-height: 1.24;
    }

    .quick-list {
      margin: 0;
      padding-left: 1.15em;
      color: var(--ink);
      font-size: clamp(20px, 2.7vw, 27px);
    }

    .quick-list li + li {
      margin-top: 4px;
    }

    .q-label {
      color: var(--brand-dark);
      font-weight: 900;
    }

    .swipe-edge {
      position: fixed;
      top: 0;
      bottom: 0;
      width: 34px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 160ms ease;
      z-index: 20;
    }

    .swipe-edge.left {
      left: 0;
      background: linear-gradient(90deg, rgba(49, 95, 114, 0.22), transparent);
    }

    .swipe-edge.right {
      right: 0;
      background: linear-gradient(270deg, rgba(49, 95, 114, 0.22), transparent);
    }

    .swipe-edge.show {
      opacity: 1;
    }

    .muted {
      color: var(--muted);
    }

    @media (max-width: 760px) {
      body {
        font-size: 18px;
      }

      .topline {
        align-items: flex-start;
        flex-direction: column;
      }

      .progress-pill {
        width: 100%;
        text-align: center;
      }

      .anchors li {
        grid-template-columns: 82px 1fr;
      }
    }

    @media (orientation: landscape) and (min-width: 900px) {
      .card-body {
        grid-template-columns: 1fr 1.35fr;
      }

      .span-all {
        grid-column: 1 / -1;
      }
    }

    @media print {
      body {
        background: #fff;
      }

      .notice {
        display: none;
      }

      .app {
        padding: 0;
      }

      .card {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="topline">
        <h1>PANSS 评分锚点速查卡</h1>
        <div class="progress-pill" id="progress">P1 妄想</div>
      </div>
    </header>

    <main>
      <article class="card" aria-live="polite">
        <div class="card-head">
          <div class="title-row">
            <h2 class="item-title" id="itemTitle">P1 妄想</h2>
            <div class="dimension" id="dimension">阳性量表</div>
          </div>
          <p class="focus-line" id="focus"></p>
        </div>
        <div class="card-body">
          <section>
            <h2>追问路径</h2>
            <ul class="quick-list" id="questions"></ul>
          </section>

          <section class="span-all scale-section">
            <h2>1-7 分现场定级</h2>
            <ol class="anchors" id="anchors"></ol>
          </section>

          <section class="span-all">
            <h2>易混淆点</h2>
            <p class="muted" id="confusions"></p>
          </section>
        </div>
      </article>

    </main>
  </div>
  <div class="swipe-edge left" id="swipeLeft"></div>
  <div class="swipe-edge right" id="swipeRight"></div>

  <script>
    const levelNames = ["无", "可疑", "轻度", "中度", "较重", "重度", "极重"];
    const levelGuides = [
      "未见该表现；访谈、观察和补充信息均不支持。",

    ];
    const domainLevelGuides = {

      ],

        "持续影响访谈、睡眠、活动或关系。",
        "痛苦明显；反复需要安抚或确认。",
        "严重且难缓解；功能显著下降。",

        "轻度困难；提示后能完成。",
        "访谈中反复需要提示或具体化。",
        "简单任务也常出错；日常判断受影响。",
        "严重困难；配合评估明显受限。",
        "基本无法完成任务，或严重混乱需照护。"
      ],
      function: [
        "启动、坚持和社交参与基本正常。",
        "轻微减少；仍可自行完成。",
        "明确减少；偶需提醒或鼓励。",
        "日常活动或社交明显受限。",
        "多数任务需督促或陪同。",
        "严重受限；难以维持基本安排。",
        "几乎完全不能启动或参与日常。"
      ]
    };
    const domainExamples = {
      belief: [
        "例：追问后无被害、特殊身份、被控制等固定信念。",
        "例：说“可能有人针对我”，但能承认也许是误会。",
        "例：偶尔认为同事针对自己，解释后能部分接受。",
        "例：反复坚称被监视，谈话需要围绕证据澄清。",
        "例：因确信被害而回避出门、报警或与人冲突。",
        "例：多数决定受信念驱动，家属难以劝回现实。",

      ],
      speech: [
        "例：能按时间、人物、事件讲清楚。",
        "例：偶尔答偏，但提醒后马上修正。",

        "例：多次需要“这和刚才有什么关系？”来拉回。",

        "例：大段内容无法理解，只能获得零散片段。",
        "例：问答基本不能成立，无法可靠完成评估。"
      ],
      behavior: [

        "例：有点急、烦或怪异，但不影响流程。",
        "例：明显坐立不安、易怒或冲动，提醒后能停。",
        "例：打断、争辩、拒答或激动，需设限才能继续。",
        "例：多次升温、威胁、摔物倾向或反复违反限制。",
        "例：很难降温，需要人员持续陪同或环境管理。",
        "例：已经失控或即将攻击、自伤、冲出现场。"
      ],
      negative: [
        "例：表情、语调、主动交流和社交接近既往。",
        "例：略显平淡或被动，但仍自然回应。",
        "例：表情少、回答短，提示后还能展开。",
        "例：持续少语、少表情或少主动，访谈明显受影响。",
        "例：多数时候需要别人推动，社交和日常参与下降。",
        "例：几乎不主动说话/活动，功能明显依赖照护。",
        "例：基本无情感回应、无主动活动或完全退缩。"
      ],
      mood: [
        "例：无持续担忧、低落、内疚或躯体焦虑。",
        "例：偶尔紧张/低落，话题转开后可缓解。",
        "例：明确痛苦，但睡眠、活动或配合影响较小。",
        "例：症状持续占用注意，影响访谈或一天安排。",
        "例：反复求证、哭泣、自责或担心，需要安抚。",
        "例：明显无望、惊恐或躯体化，功能显著下降。",

        "例：需提示才能完成倒数、概括或解释后果。",
        "例：反复分心、定向错误或判断偏差影响访谈。",
        "例：简单任务常失败，日常决定已受影响。",
        "例：严重混乱或判断差，需要他人持续协助。",
        "例：不定向、无法配合，或判断问题带来立即风险。"
      ],
      function: [
        "例：能自己起床、洗漱、安排活动和基本社交。",

      default: [

    };
    function getGuideType(item) {
      if (["P1", "P5", "P6", "G9", "G15"].includes(item.id)) return "belief";
      if (["P2", "N3", "N6", "N7"].includes(item.id)) return "speech";
      if (["P4", "P7", "G4", "G5", "G8", "G14", "S1", "S2", "S3"].includes(item.id)) return "behavior";
      if (["G2", "G3", "G6", "G1"].includes(item.id)) return "mood";
      if (["N5", "G10", "G11", "G12"].includes(item.id)) return "cognition";
      if (["N4", "G7", "G13", "G16"].includes(item.id)) return "function";
      if (item.id.startsWith("N")) return "negative";
      return "default";
    }

    const items = [
      {
        id: "P1",
        name: "妄想",

      {

        confusions: "N4是被动/淡漠退缩；G16强调主动回避及背后动机。"
      },
      {
        id: "S1",
        name: "愤怒",
        dimension: "补充条目",
        focus: "主观愤怒、怨恨、易激惹和怒气表达的强度，重点看是否外显、是否可平复。",
        anchors: ["无明显愤怒", "轻微烦躁", "容易生气但可控制", "明显愤怒，谈话受影响", "频繁发怒或责怪他人", "强烈怒气，需反复降温", "怒气失控或迫切风险"],
        questions: ["最近有没有经常觉得气、恨或憋不住火？", "发怒时能不能停下来？通常持续多久？", "有没有因此吵架、威胁、摔东西或差点动手？"],
        confusions: "S1看情绪体验和怒气强度；P7更看敌对、威胁或攻击表达；G14更看冲动控制。"
      },
      {
        id: "S2",
        name: "延迟满足困难",
        dimension: "补充条目",
        focus: "想要某事时能否等待、协商或遵守限制，是否因立刻满足需求而冲突或冒险。",
        anchors: ["能等待", "偶尔急躁", "等待困难但可劝导", "明显急迫，反复要求", "常因不能等待而冲突", "很难接受限制，需管理", "完全不能等待，立即风险"],
        questions: ["想要东西或想做事时，能等一等吗？", "别人说现在不行时，你通常怎么反应？", "有没有因等不了而冲出去、抢东西、吵闹或动手？"],
        confusions: "与G14冲动控制重叠，但S2更聚焦“不能等”和要求立刻满足；也需区分现实需求未被满足。"
      },
      {
        id: "S3",
        name: "情感不稳",
        dimension: "补充条目",
        focus: "情绪是否快速、大幅、难预测地变化，以及这种波动是否影响互动和行为安全。",
        anchors: ["情绪稳定", "轻微波动", "偶有明显起伏", "情绪变化影响访谈", "频繁大幅波动", "难预测且需持续安抚", "剧烈波动伴危险行为"],
        questions: ["最近情绪会不会很快从平静变成哭、怒或兴奋？", "这种变化通常由什么触发？多久能平复？", "情绪一变时，有没有伤人、自伤、冲出去或失控行为？"],
        confusions: "S3看情绪波动速度和幅度；G2/G6看焦虑或抑郁强度；P4看兴奋和活动增多。"
      }
    ];

    let currentIndex = 0;

    const progress = document.getElementById("progress");
    const itemTitle = document.getElementById("itemTitle");
    const dimension = document.getElementById("dimension");
    const focus = document.getElementById("focus");
    const card = document.querySelector(".card");
    const questions = document.getElementById("questions");
    const anchors = document.getElementById("anchors");
    const confusions = document.getElementById("confusions");
    const swipeLeft = document.getElementById("swipeLeft");
    const swipeRight = document.getElementById("swipeRight");
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    function renderCard() {
      const item = items[currentIndex];
      const label = `${item.id} ${item.name}`;
      const guideType = getGuideType(item);
      const guideSet = domainLevelGuides[guideType] || levelGuides;
      const exampleSet = domainExamples[guideType] || domainExamples.default;

      document.title = `${label} - PANSS 评分锚点速查卡`;
      progress.textContent = label;
      itemTitle.textContent = label;
      dimension.textContent = item.dimension;
      focus.textContent = item.focus;
      confusions.textContent = item.confusions;

      questions.innerHTML = "";
      const questionLabels = ["先开放", "再定级", "看影响/风险"];
      item.questions.forEach((question, index) => {
        const li = document.createElement("li");
        const label = document.createElement("span");
        label.className = "q-label";
        label.textContent = `${questionLabels[index] || "补充"}：`;
        li.append(label, document.createTextNode(question));
        questions.appendChild(li);
      });

      anchors.innerHTML = "";
      item.anchors.forEach((text, index) => {
        const li = document.createElement("li");
        const score = document.createElement("span");
        const panel = document.createElement("div");
        const track = document.createElement("div");
        const fill = document.createElement("div");
        const anchorText = document.createElement("span");
        const anchorMain = document.createElement("span");
        const anchorGuide = document.createElement("span");
        const anchorExample = document.createElement("span");
        score.className = "score";
        panel.className = "bar-panel";
        track.className = "bar-track";
        fill.className = "bar-fill";
        anchorText.className = "anchor-text";
        anchorMain.className = "anchor-main";
        anchorGuide.className = "anchor-guide";
        anchorExample.className = "anchor-example";
        score.textContent = `${index + 1} ${levelNames[index]}`;
        fill.style.width = `${((index + 1) / 7) * 100}%`;
        anchorMain.textContent = text;
        anchorGuide.textContent = guideSet[index];
        anchorExample.textContent = exampleSet[index];
        anchorText.append(anchorMain, anchorGuide, anchorExample);
        track.append(fill, anchorText);
        panel.appendChild(track);
        li.append(score, panel);
        anchors.appendChild(li);
      });
    }

    function go(delta) {
      const nextIndex = Math.min(items.length - 1, Math.max(0, currentIndex + delta));
      if (nextIndex !== currentIndex) {
        currentIndex = nextIndex;
        card.classList.add("is-changing");
        setTimeout(() => {
          renderCard();
          card.classList.remove("is-changing");
        }, 110);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function flashEdge(delta) {
      const edge = delta < 0 ? swipeLeft : swipeRight;
      edge.classList.add("show");
      window.setTimeout(() => edge.classList.remove("show"), 180);
    }

    card.addEventListener("touchstart", (event) => {
      const touch = event.changedTouches[0];
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    card.addEventListener("touchend", (event) => {
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStartX;
      const dy = touch.clientY - touchStartY;
      const elapsed = Date.now() - touchStartTime;
      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.4 && elapsed < 900) {
        const delta = dx < 0 ? 1 : -1;
        flashEdge(delta);
        go(delta);
      }
    }, { passive: true });

    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        go(-1);
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        go(1);
      }
    });

    renderCard();
  </script>
</body>
</html>
